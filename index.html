<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:wght@400;600;700&display=swap" rel="stylesheet"/>
  <title>Frontend Mentor | Product list with cart</title>
  <link rel="stylesheet" href="style.css">
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  
</head>
<body>
  <header></header>
  <main class="main-container">
    <!-- Products Section -->
    <section class="products-section">
      <h1 class="section-title">Desserts</h1>
      <div class="products-grid" id="products-grid"></div>
    </section>
    <!-- Cart Section -->
    <aside class="cart-section">
      <h2 class="cart-title">Your Cart (<span class="cart-count">0</span>)</h2>
       <div class="empty-cart">
        <img src="assets/images/illustration-empty-cart.svg" alt="Empty cart" class="empty-cart-image">
        <p class="empty-cart-message">Your added items will appear here</p>
       </div>
      <div class="cart-items"></div>
      <div class="cart-total">
        <p class="cart-total-label">Order Total</p>
        <span class="cart-total-price">$0.00</span>
      </div>
      <div class="delivery-notice">
        <img src="assets/images/icon-carbon-neutral.svg" alt="carbon-neutral-icon"  class="carbon-neutral-icon">
        <p>This is a <strong>carbon-neutral</strong> delivery</p>
      </div>
      <button type="button" class="confirm-order-btn">Confirm Order</button>
    </aside> 
  </main>
  <footer></footer>
  <script src="script.js"></script>
</body>
</html>
